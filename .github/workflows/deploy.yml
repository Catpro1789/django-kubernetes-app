name: CI/CD Django App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python manage.py test || true
      - name: Use Minikube Docker
        run: eval $(minikube -p minikube docker-env)
      - name: Build Docker image
        run: docker build -t django-kubernetes-app:latest .
      - name: Create/update secrets
        run: |
          kubectl create secret generic django-secrets -n django-app \
            --from-literal=db_user="django_user" \
            --from-literal=db_password="SuperSecret123!" \
            --from-literal=secret_key="django-insecure-key" \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s-manifests/ -n django-app
      - name: Update Django Deployment image
        run: |
          kubectl set image deployment/django-deployment \
            django-app=django-kubernetes-app:latest -n django-app
          kubectl rollout status deployment/django-deployment -n django-app --timeout=300s
      - name: Check Kubernetes resources
        run: |
          kubectl get pods -n django-app
          kubectl get svc -n django-app
          kubectl get ingress -n django-app
